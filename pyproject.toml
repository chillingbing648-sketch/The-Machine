[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-machine"
version = "0.1.0"
description = "Autonomous Program Repair, Fault Localization, and Self-Improving Software Reliability Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "The Machine Research Team" }
]
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
the-machine = "the_machine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
